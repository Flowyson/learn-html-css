<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>순서형, 비순서형 목록</title>
  </head>
  <body>
    <h1>목록</h1>
    <h2>비순서형 목록</h2>

    <!--순서가 상관없는 독립된 아이템을 포함할 수 있는 목록-->
    <p>
      다양한 메뉴를<br />
      카페 W에서 즐겨보세요
    </p>
    <ul type="circle">
      <li>카페 w만의 특별함</li>
      <li>카페 w 커피</li>
      <li>사용한 시도</li>
      <li>소중한</li>
      <li>카페 w 카드</li>
    </ul>

    <!--순서가 중요한 독립된 아이템을 포함할 수 있는 목록-->
    <h3>카페 W 인기 강좌</h3>
    <ol>
      <li>UI 구조 & 디자인</li>
      <li>모바일 웹 UI 제작 실습</li>
      <li>UI 인터렉션 주니어</li>
      <li>React 프로그래밍</li>
    </ol>
  </body>
</html>
